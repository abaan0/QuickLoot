name: QuickLoot food & grocery alerts

on:
  schedule:
    # Every five minutes, offset from the top of the hour (UTC).
    - cron: '3-58/5 * * * *'
  workflow_dispatch:
    inputs:
      test_alert:
        description: Send one test alert instead of checking sources
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: quickloot-deal-check
  cancel-in-progress: false

jobs:
  check-deals:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Scan and send alerts
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TEST_ALERT: ${{ inputs.test_alert }}
        run: |
          if [ "$TEST_ALERT" = "true" ]; then
            python -m quickloot --test-alert
          else
            python -m quickloot
          fi

      - name: Save duplicate-check state
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state/seen.json
          if ! git diff --cached --quiet; then
            git commit -m "chore: remember checked deals [skip ci]"
            git push
          else
            echo "No new state to save."
          fi
